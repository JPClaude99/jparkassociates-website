name: Ledger draft review

# THE WEEKLY REVIEW EMAIL
#
# One email a week, on Monday, carrying every Ledger article that has been
# drafted and is waiting to be published. It contains:
#
#   • the full text of each draft, in the body, branded and readable in the
#     inbox — no GitHub, no attachment needed to judge the writing;
#   • ledger-drafts.pdf         — the same drafts laid out for print, each
#                                 followed by its reviewer-notes panel;
#   • Ledger-review-notes.docx  — the reviewer notes on their own, in Word,
#                                 ready to mark up and send back.
#
# Merging the pull request is what deploys the article to jparkassociates.com;
# ledger-published.yml then sends the short "it's live" notice.
#
# ── CADENCE: two triggers and a lock, not one trigger ─────────────────────
# Monday, once. Getting that right needs a fast path, a floor, and something
# that stops the two from ever mailing the same thing twice.
#
#   FAST PATH — `workflow_run` on `Ledger announcement scan`, the Monday job
#   that actually drafts the articles. Firing off its completion rather than
#   off a clock of our own means we never race it: the drafts exist by the time
#   we look. This is what sends the email on a normal week.
#
#   FLOOR — a Monday cron, late enough that the fast path has long since run.
#   `workflow_run` is edge-triggered and edges get missed: the scan can fail
#   before it opens the PR, be disabled, or simply not run. The floor covers
#   those. It does NOT cover the one failure that would take both down at once
#   — GitHub suspending every scheduled workflow in a repo idle for 60 days —
#   because the floor is itself a cron. Nothing inside this repo can cover
#   that; GitHub emails the admin when it suspends, and a commit re-enables it.
#
#   LOCK — a per-week send record listing the pull requests already emailed.
#   Every trigger, every re-run and every manual dispatch reads it first and
#   emails only the drafts not already in it.
#
#   The key is the pull request NUMBER and nothing else. Not the set of open
#   drafts: merging one of two changed a set-shaped key, and the 20:00 floor
#   re-sent the whole review five hours after the 15:00 one. And not the head
#   SHA either, which had the same fault one level down — a one-word copyedit,
#   a rebase, or the "Update branch" button moves the head, and the floor read
#   that as a draft it had never seen. Once a week means once a week, whatever
#   the branch does in between.
#
#   Next Monday the week rolls over and an unreviewed draft resurfaces — that
#   nag is deliberate, and it is the only thing standing between a forgotten
#   draft and permanent silence.
#
# What is NOT a trigger, and must never become one again: `pull_request`. The
# previous version of this file fired on it, unfiltered, so every unrelated PR
# opened anywhere in the repo re-sent the whole alert. This mail is about the
# state of the drafts, not about any one pull request.
#
# ── FAILURE BEHAVIOUR ─────────────────────────────────────────────────────
#   • Both builders are continue-on-error, and the email names only the
#     enclosures that actually reached disk. Losing an attachment never costs
#     you the email.
#   • The de-duplication lock fails OPEN. If the cache service is unreachable
#     the record reads empty and the email goes out — a duplicate is an
#     annoyance, a missed review is a week of lost work.
#   • The lock lives in a BRANCH-SCOPED Actions cache, so a manual dispatch
#     from any ref other than the default branch would neither see nor write
#     the record the scheduled runs use, and would duplicate. That case is
#     refused outright rather than silently duplicating.
#   • The two builders are independent: the Word note needs no browser, so a
#     Chromium failure cannot take it down with the PDF.
#   • If the SMTP secrets are missing or wrong the send step FAILS, and GitHub
#     emails the repo admin about the failed run — so a silently-dead alerter
#     is not a failure mode.
#   • Nothing open to review → no email. That is a clean no-op, not a failure.
#
# ── One-time setup (≈3 minutes) ───────────────────────────────────────────
# Add two repository secrets under:
#   Settings → Secrets and variables → Actions → New repository secret
#     LEDGER_ALERT_SMTP_USER   the Gmail / Google Workspace mailbox to send FROM
#     LEDGER_ALERT_SMTP_PASS   a Google App Password for that mailbox
# Create the App Password at myaccount.google.com → Security → 2-Step
# Verification → App passwords, and store it as the 16 characters with NO
# SPACES — Google displays it in four groups, and pasting the spaces is the
# usual cause of "535-5.7.8 Username and Password not accepted".
# (Workspace accounts: an admin may first need to allow app passwords for the
# org.) LEDGER_ALERT_SMTP_USER must be the mailbox the App Password belongs to,
# not an alias. The From identity and the recipient live in the composite
# action, .github/actions/send-ledger-email.
# ───────────────────────────────────────────────────────────────────────────

on:
  # Fast path: the moment the Monday scan finishes.
  workflow_run:
    workflows: ["Ledger announcement scan"]
    types: [completed]
    branches: [main]
  # Floor: Mondays 20:00 UTC — 13:00 Pacific in summer, 12:00 in winter. Hours
  # after the 15:00 UTC scan, so on a normal week the lock below has already
  # been taken and this run sends nothing. It exists for the weeks the scan
  # never ran at all.
  schedule:
    - cron: '0 20 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# QUEUE, never cancel. The send is the last step, behind an npm install and a
# Chromium render, so cancel-in-progress would sooner or later kill a run that
# had already sent — or, worse, kill one that was about to. Queuing is safe
# because the second run re-checks the lock and finds it taken.
concurrency:
  group: ledger-draft-review
  cancel-in-progress: false

jobs:
  ledger-draft-review:
    # A cancelled or skipped scan drafted nothing and decided nothing; there is
    # no news to report. A FAILED scan still runs — it may well have opened the
    # pull request before dying, and the lock stops the retry mailing twice.
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion != 'cancelled' &&
       github.event.workflow_run.conclusion != 'skipped')
    runs-on: ubuntu-latest

    steps:
      # The lock is a branch-scoped Actions cache. A dispatch from another ref
      # would read an empty record and write one the scheduled runs never see,
      # so it would mail a second copy of the same review. Refuse instead.
      - name: This week, on the right branch
        id: week
        env:
          # Through the environment, never interpolated into the script: a ref
          # name may legally contain a backtick, a $ or a semicolon, and this
          # step's whole job is to be the thing that cannot be talked around.
          REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Run this workflow from $DEFAULT_BRANCH. The de-duplication record is a branch-scoped Actions cache, so a run from $REF cannot see it and would send a duplicate review email."
            exit 1
          fi
          # ISO year and week, from date(1) rather than hand-rolled arithmetic.
          echo "id=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Load this week's send record
        continue-on-error: true          # unreachable cache -> empty record -> send
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ledger-sent
          key: ledger-review-${{ steps.week.outputs.id }}-probe
          restore-keys: ledger-review-${{ steps.week.outputs.id }}-

      - name: Find Ledger drafts not yet emailed this week
        id: find
        uses: actions/github-script@v8
        env:
          DRAFTS_JSON: ${{ runner.temp }}/drafts.json
        with:
          script: |
            const fs = require('fs');
            // Which pull requests have already been emailed this week.
            // Missing or unreadable reads as empty, which sends — see the
            // fail-open note in the header.
            const RECORD = '${{ runner.temp }}/ledger-sent/sent.json';
            let sent = [];
            try { sent = JSON.parse(fs.readFileSync(RECORD, 'utf8')); } catch { /* first run this week */ }
            if (!Array.isArray(sent)) sent = [];

            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const open = prs.filter(p =>
              !p.draft &&
              (p.title.startsWith('[Ledger]') ||
               (p.head && p.head.ref && p.head.ref.startsWith('ledger/auto-')))
            );
            // Pull request number only — see the LOCK note in the header for why
            // the head SHA is deliberately not part of this.
            const keyOf = p => String(p.number);
            const drafts = open.filter(p => !sent.includes(keyOf(p)));
            const held = open.length - drafts.length;
            if (held) core.info(`${held} draft(s) already emailed this week; not resending.`);
            core.setOutput('count', String(drafts.length));
            const body = drafts.map(p => {
              const ageH = Math.round((Date.now() - Date.parse(p.created_at)) / 36e5);
              const age = ageH >= 48 ? `${Math.round(ageH / 24)}d` : `${ageH}h`;
              return `#${p.number} — ${p.title}\n${p.html_url}\n(open ${age} · branch ${p.head.ref})`;
            }).join('\n\n');
            core.setOutput('body', body);
            // The PR title already starts with "[Ledger]"; the subject says so
            // in words, so strip the tag rather than printing it twice.
            const plain = t => t.replace(/^\[Ledger\]\s*/, '');
            core.setOutput('subject', drafts.length === 1
              ? `Ready for review: ${plain(drafts[0].title)}`
              : `${drafts.length} Ledger drafts ready for review`);
            // Hand the builders what they need. Written to a file rather than a
            // step output: PR bodies are long and contain arbitrary markdown.
            fs.writeFileSync(process.env.DRAFTS_JSON, JSON.stringify(drafts.map(p => ({
              number: p.number,
              title: p.title,
              html_url: p.html_url,
              body: p.body,
              head: { sha: p.head.sha, ref: p.head.ref },
              created_at: p.created_at,
            }))));
            // The record this run WOULD write. Copied into place only after the
            // email is actually away, so a run that dies mid-build leaves the
            // record untouched and the next trigger finishes the job.
            fs.writeFileSync('${{ runner.temp }}/pending.json',
                             JSON.stringify([...new Set([...sent, ...drafts.map(keyOf)])]));

            if (drafts.length) {
              core.notice(`Ledger drafts awaiting review: ${drafts.map(p => '#' + p.number).join(', ')}`);
            } else {
              core.info('Nothing new to review this week — no email.');
            }

      # One place to compute "should this run do anything", so the steps below
      # carry a short condition instead of many copies of a long one.
      - name: Decide whether to build and send
        id: gate
        run: |
          if [ "${{ steps.find.outputs.count }}" = "0" ]; then
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the builders
        if: steps.gate.outputs.go == 'yes'
        uses: actions/checkout@v6
        with:
          # Always the default branch's builders, never a pull request's.
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node
        if: steps.gate.outputs.go == 'yes'
        continue-on-error: true
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # continue-on-error, like the builders it feeds. A transient registry
      # blip used to fail the job outright and send NOTHING — which is the one
      # outcome this workflow exists to prevent. Without the packages the two
      # build steps fail, the enclosures are absent, and the plain-text alert
      # still goes out naming the pull request.
      - name: Install the builders' dependencies
        if: steps.gate.outputs.go == 'yes'
        continue-on-error: true
        run: npm install --no-save --no-audit --no-fund puppeteer@25 marked@18 docx@9

      # Word first, and on purpose: it needs no browser, so it is still on disk
      # for the email to name even if Chromium falls over in the next step.
      - name: Build the Word review note
        if: steps.gate.outputs.go == 'yes'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRAFTS_JSON: ${{ runner.temp }}/drafts.json
          DOCX_OUT: ${{ runner.temp }}/Ledger-review-notes.docx
        run: node automation/ledger-review-notes-docx.mjs

      # Writes both the PDF packet and the HTML email body — the body carries a
      # full copy of every draft, from the same extraction pass as the PDF, so
      # the two can never describe different articles.
      - name: Build the draft review PDF and email body
        if: steps.gate.outputs.go == 'yes'
        continue-on-error: true      # the email matters more than the packet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRAFTS_JSON: ${{ runner.temp }}/drafts.json
          OUT_PATH: ${{ runner.temp }}/ledger-drafts.pdf
          DOCX_PATH: ${{ runner.temp }}/Ledger-review-notes.docx
          EMAIL_HTML_OUT: ${{ runner.temp }}/email.html
        run: node automation/ledger-draft-pdf.mjs

      # Decide from what is actually on disk, not from either build's exit code —
      # the PDF builder writes the branded email body before the work that can fail.
      - name: Decide what the email can carry
        id: mail
        if: steps.gate.outputs.go == 'yes'
        run: |
          html='${{ runner.temp }}/email.html'
          pdf='${{ runner.temp }}/ledger-drafts.pdf'
          docx='${{ runner.temp }}/Ledger-review-notes.docx'
          att=''
          if [ -s "$html" ]; then echo "html=$html" >> "$GITHUB_OUTPUT"; else echo "html=" >> "$GITHUB_OUTPUT"; fi
          if [ -s "$pdf" ];  then att="$pdf";  else echo "::warning::No draft review PDF this run; sending without it."; fi
          if [ -s "$docx" ]; then att="${att:+$att,}$docx"; else echo "::warning::No Word review note this run; sending without it."; fi
          echo "attachments=$att" >> "$GITHUB_OUTPUT"
          # Does the HTML body actually carry the article copy? The builder
          # stamps the count. Without this the plain-text part claimed "the full
          # text is in the HTML version" even when Chromium had died and the
          # body held nothing but a PR link.
          # What the HTML body actually ended up carrying. The builder stamps
          # three numbers; the plain-text part is written from them rather than
          # from an assumption, because it is a whole message on its own.
          stamp=$(grep -o '<!--ledger:[^>]*-->' "$html" 2>/dev/null | head -1)
          num() { printf '%s' "$stamp" | sed -n "s/.*$1=\([0-9]*\).*/\1/p"; }
          arts=$(num articles); skip=$(num skipped); full=$(num full)
          arts=${arts:-0}; skip=${skip:-0}; full=${full:-0}
          echo "articles=$arts" >> "$GITHUB_OUTPUT"
          if [ "$arts" = "0" ]; then
            cov='The drafts could not be rendered into this email — see the Actions log. Read them in the pull request above.'
            echo "::warning::The email body carries no article text this run."
          elif [ "$skip" != "0" ] || [ "$full" != "$arts" ]; then
            cov="This email reproduces $full of $((arts + skip)) drafts in full; read the rest in the pull request above."
            echo "::warning::Only $full of $((arts + skip)) drafts are reproduced in full."
          else
            cov='The full text of each draft is in the HTML version of this email.'
          fi
          echo "coverage=$cov" >> "$GITHUB_OUTPUT
          echo "pdf=$([ -s "$pdf" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "docx=$([ -s "$docx" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          [ -s "$html" ] || echo "::warning::No branded HTML body this run — the drafts could not be rendered. Falling back to plain text."

      # The draft list was snapshotted before an npm install and a Chromium
      # render — minutes ago. If Justin merged in that window the drafts are
      # live, and an email insisting they are "not live yet" is worse than no
      # email: ledger-published.yml has already said the opposite.
      - name: Are the drafts still unmerged?
        id: recheck
        if: steps.gate.outputs.go == 'yes'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const drafts = JSON.parse(fs.readFileSync('${{ runner.temp }}/drafts.json', 'utf8'));
            const states = await Promise.all(drafts.map(d =>
              github.rest.pulls.get({ ...context.repo, pull_number: d.number })
                .then(r => ({ number: d.number, state: r.data.state, merged: !!r.data.merged }))
                // 'unknown' counts as open and unmerged: a GitHub hiccup must
                // not eat the email.
                .catch(() => ({ number: d.number, state: 'unknown', merged: false }))));
            // MERGED is the only state that makes this email false. The body,
            // the PDF and the Word note were all built from the snapshot taken
            // before the render and say in as many words that these drafts are
            // "not live yet" — which ledger-published.yml has just contradicted.
            // Send nothing, and leave the record unwritten so the next run
            // rebuilds from what is actually open.
            const merged = states.filter(s => s.merged);
            // Closed WITHOUT merging is different: nothing in the email becomes
            // untrue, the draft was simply rejected. Muting the whole review for
            // it used to cost the surviving drafts a full week, silently and on
            // a green run.
            const rejected = states.filter(s => s.state === 'closed' && !s.merged);
            const live = states.filter(s => s.state !== 'closed');
            core.setOutput('open', merged.length || !live.length ? 'no' : 'yes');
            if (merged.length) {
              core.warning(`${merged.map(s => '#' + s.number).join(', ')} merged while this run was ` +
                           `building, so the review it built says "not live yet" about an article that ` +
                           `is. Not sending; the record stays unwritten and the next run rebuilds.`);
            } else if (!live.length) {
              core.warning('Every draft was closed while this run was building; nothing left to review.');
            } else if (rejected.length) {
              core.warning(`${rejected.map(s => '#' + s.number).join(', ')} closed unmerged while this ` +
                           `run was building; sending the review for the ${live.length} still open.`);
            }

      - name: Email the weekly review
        if: steps.gate.outputs.go == 'yes' && steps.recheck.outputs.open == 'yes'
        # Sender and recipient live in the composite action, not here — see its header.
        uses: ./.github/actions/send-ledger-email
        with:
          smtp_user: ${{ secrets.LEDGER_ALERT_SMTP_USER }}
          smtp_pass: ${{ secrets.LEDGER_ALERT_SMTP_PASS }}
          subject: ${{ steps.find.outputs.subject }}
          html_file: ${{ steps.mail.outputs.html }}
          attachments: ${{ steps.mail.outputs.attachments }}
          # Plain-text alternative, always sent alongside the HTML part. This is
          # the whole message for a text-only client, so it stands on its own.
          body: |
            Ledger articles are drafted and ready for your review. They are not
            live on jparkassociates.com yet — merging the pull request is what
            publishes them.

            ${{ steps.find.outputs.body }}

            ${{ steps.mail.outputs.coverage }}
            ${{ steps.mail.outputs.pdf == 'yes'
                && 'Attached: ledger-drafts.pdf — each draft as it will read on the site, with reviewer notes after it.'
                || 'The PDF review packet could not be built this run; see the Actions log.' }}
            ${{ steps.mail.outputs.docx == 'yes'
                && 'Attached: Ledger-review-notes.docx — the reviewer notes in Word, ready to mark up.'
                || 'The Word review note could not be built this run; see the Actions log.' }}

            —
            J Park & Associates · Certified Public Accountants
            2529 Foothill Blvd. Ste 101, La Crescenta, CA 91214 · (818) 248-1580

            Automated weekly review (.github/workflows/ledger-draft-alert.yml),
            sent after each Monday announcement scan. A draft left unmerged
            appears again next Monday.

      # Written AFTER the send, never before: a run that dies during the build
      # must leave the record untouched so the next trigger can finish the job.
      # Only a review that actually CARRIED the drafts counts as sent. If the
      # builders failed and the email went out as a bare pull-request link, the
      # record stays unwritten so the floor tries again — otherwise a transient
      # npm failure at 15:45 would mark the week done and the reviewer would
      # never see the articles at all. Two degraded alerts beat one degraded
      # alert and no review, and there are only two triggers in a week, so this
      # cannot loop.
      - name: Record what went out
        id: record
        if: steps.gate.outputs.go == 'yes' && steps.recheck.outputs.open == 'yes'
        run: |
          if [ "${{ steps.mail.outputs.articles }}" = "0" ]; then
            echo "::warning::This review carried no article text, so the week is NOT marked done; the next run will try again."
            echo "keep=no" >> "$GITHUB_OUTPUT"
          else
            mkdir -p '${{ runner.temp }}/ledger-sent'
            cp '${{ runner.temp }}/pending.json' '${{ runner.temp }}/ledger-sent/sent.json'
            echo "keep=yes" >> "$GITHUB_OUTPUT"
          fi

      # Cache entries are immutable, so each write takes a fresh key and the
      # restore-keys prefix above picks up the most recent one for the week.
      - name: Keep the record for the rest of the week
        if: steps.record.outputs.keep == 'yes'
        continue-on-error: true         # a lost record costs a duplicate, not the email
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ledger-sent
          key: ledger-review-${{ steps.week.outputs.id }}-${{ github.run_id }}-${{ github.run_attempt }}
