name: Ledger published

# Emails jasonpark@jparkassociates.com once, when a [Ledger] pull request merges
# and its articles go live on jparkassociates.com. The companion to
# ledger-draft-alert.yml, which sends the weekly review email that gets the
# article read in the first place.
#
# Every Ledger email comes from the same identity — The Ledger Bot
# <marketing@jparkassociates.com> — so the thread reads as one voice. Gmail only
# accepts a From that is the authenticated mailbox or an address verified on it
# under Settings → Accounts → "Send mail as"; marketing@ is verified on the
# LEDGER_ALERT_SMTP_USER account, which is what makes this work.
#
# Article facts come from blog/posts.js, the manifest behind the blog index, so
# this email and the site cannot disagree. A Ledger PR that touched only
# automation publishes nothing and sends nothing — that is a clean no-op, not a
# failure.
#
# But a PR that adds blog/<slug>.html WITHOUT adding it to blog/posts.js is not
# a no-op: the article is live on the site and missing from the index, so no
# reader will ever reach it. That case FAILS the run on purpose. GitHub then
# emails the repo admin about the failed run, which is the only thing that
# turns a silently-orphaned article into something anyone finds out about.
# Fix the manifest, then re-send the notice with the workflow_dispatch below.
#
# Uses the same two secrets as the weekly review; see that file's header for the
# App Password setup and its gotchas.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged [Ledger] PR number to re-send the publish notice for
        required: true

permissions:
  contents: read
  pull-requests: read

# One publish notice at a time, repo-wide, and queued rather than cancelled —
# the send is the last step, so cancelling mid-flight could kill a notice that
# was already half out the door.
#
# Deliberately NOT keyed on the pull request. A workflow-level expression is
# evaluated from the raw event before any step runs, so it cannot use the
# sanitised number below: a dispatch typed as "#42" grouped as
# `ledger-published-#42` and never matched the merge path's `ledger-published-42`,
# which is exactly the collision the group existed to prevent. These runs are
# rare and take under a minute, so serialising all of them costs nothing and
# cannot be talked out of matching.
concurrency:
  group: ledger-published
  cancel-in-progress: false

jobs:
  notify:
    # Only merged Ledger PRs. A closed-without-merge PR published nothing.
    # Manual dispatch is always allowed — it re-sends the notice for a PR you name.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       (startsWith(github.event.pull_request.title, '[Ledger]') ||
        startsWith(github.event.pull_request.head.ref, 'ledger/auto-')))
    runs-on: ubuntu-latest

    steps:
      # Digits only. A pasted "#42" would 404 the API and, separately, produce a
      # concurrency group that does not match the automatic path's.
      - name: Read the pull request number
        id: pr
        env:
          # Through the environment, not interpolated into the script — this is
          # free text from a dispatch form, and the sanitiser has to run on it
          # rather than after it has already become part of the command.
          RAW: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
        run: |
          n=$(printf '%s' "$RAW" | tr -cd '0-9')
          [ -n "$n" ] || { echo "::error::pr_number must be a number."; exit 1; }
          echo "number=$n" >> "$GITHUB_OUTPUT"

      # A "Re-run all jobs" on a SUCCESSFUL run used to re-send a byte-identical
      # notice. Keyed on the merge commit, so a genuine re-merge is a new event.
      # workflow_dispatch deliberately skips the check — a manual re-send is the
      # documented way to send this notice again.
      - name: Has this merge already been announced?
        id: lock
        if: github.event_name != 'workflow_dispatch'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/announced
          key: ledger-published-${{ steps.pr.outputs.number }}-${{ github.event.pull_request.merge_commit_sha }}
          lookup-only: true

      - name: Check out the site after the merge
        if: steps.lock.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          # The base branch as it now stands — the merge is already in it, so
          # blog/posts.js here is exactly what the live site is serving.
          ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}

      - name: Set up Node
        if: steps.lock.outputs.cache-hit != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Build the publish notice
        id: build
        if: steps.lock.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EMAIL_HTML_OUT: ${{ runner.temp }}/published.html
          EMAIL_TEXT_OUT: ${{ runner.temp }}/published.txt
          SUBJECT_OUT: ${{ runner.temp }}/subject.txt
        run: |
          node automation/ledger-published-email.mjs
          if [ -s "${{ runner.temp }}/published.html" ]; then
            echo "send=yes" >> "$GITHUB_OUTPUT"
            # A fixed "EOF" delimiter is a corrupt $GITHUB_OUTPUT waiting for the
            # day an article body contains that line. Use one nothing can guess.
            d="EOF_$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
            # Subjects are one line by construction; make that true by force
            # rather than by assumption — a newline here would break the header.
            echo "subject=$(tr '\n' ' ' < "${{ runner.temp }}/subject.txt" | sed 's/ *$//')" >> "$GITHUB_OUTPUT"
            { echo "text<<$d"; cat "${{ runner.temp }}/published.txt"; echo; echo "$d"; } >> "$GITHUB_OUTPUT"
          else
            echo "send=no" >> "$GITHUB_OUTPUT"
            echo "::notice::No articles published by this pull request; no email sent."
          fi

      - name: Email the publish notice
        if: steps.build.outputs.send == 'yes'
        # Sender lives in the composite action, not here — see its header.
        uses: ./.github/actions/send-ledger-email
        with:
          smtp_user: ${{ secrets.LEDGER_ALERT_SMTP_USER }}
          smtp_pass: ${{ secrets.LEDGER_ALERT_SMTP_PASS }}
          subject: ${{ steps.build.outputs.subject }}
          html_file: ${{ runner.temp }}/published.html
          body: ${{ steps.build.outputs.text }}

      - name: Remember that this merge was announced
        if: github.event_name != 'workflow_dispatch' && steps.build.outputs.send == 'yes'
        continue-on-error: true
        run: mkdir -p '${{ runner.temp }}/announced' && date -u > '${{ runner.temp }}/announced/at'

      - name: Keep that record
        if: github.event_name != 'workflow_dispatch' && steps.build.outputs.send == 'yes'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/announced
          key: ledger-published-${{ steps.pr.outputs.number }}-${{ github.event.pull_request.merge_commit_sha }}
