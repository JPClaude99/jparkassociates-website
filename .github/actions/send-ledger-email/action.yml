name: Send a Ledger email
description: >
  The single sender for every email The Ledger sends. Route all Ledger mail
  through this action — do not call action-send-mail directly from a workflow.

# WHY THIS EXISTS
#
# Every Ledger email must arrive as the same correspondent:
#
#     The Ledger Bot <marketing@jparkassociates.com>
#
# That identity was previously repeated in each workflow, which meant a new
# Ledger email could silently pick a different one and nobody would notice
# until it landed in the inbox looking like a stranger. It now lives here,
# once, and there is no input to override it — a workflow physically cannot
# send Ledger mail as anyone else.
#
# The address also carries the inbox avatar: Gmail draws the sender picture
# from the Google account behind the sending address, so keeping every Ledger
# email on marketing@ is what lets The Ledger Bot have its own icon,
# independent of Justin's own mail.
#
# Gmail only accepts a From that is the authenticated mailbox or an address
# verified on it under Settings → Accounts → "Send mail as". marketing@ is
# verified on the LEDGER_ALERT_SMTP_USER account; if that verification is ever
# removed, Gmail rewrites the From or rejects with 550-5.7.1.

inputs:
  subject:
    description: Subject line.
    required: true
  body:
    description: Plain-text body, always sent as the text/plain alternative.
    required: true
  html_file:
    description: >
      Path to an HTML body file. Pass a bare path; the file:// prefix is added
      here. Leave empty to send text-only.
    required: false
    default: ''
  attachments:
    description: >
      Comma-separated file paths. Empty means none. Each file is attached under
      its basename, so name the file on disk what the reader should see —
      ledger-drafts.pdf, Ledger-review-notes.docx.
    required: false
    default: ''
  to:
    description: >
      Recipient. Every Ledger email goes to Justin unless a caller says
      otherwise, so the address is defaulted here rather than repeated in each
      workflow — one place to change it if it ever moves.
    required: false
    default: jasonpark@jparkassociates.com
  smtp_user:
    description: secrets.LEDGER_ALERT_SMTP_USER — the authenticated mailbox.
    required: true
  smtp_pass:
    description: secrets.LEDGER_ALERT_SMTP_PASS — its Google App Password.
    required: true

runs:
  using: composite
  steps:
    - name: Send as The Ledger Bot
      uses: dawidd6/action-send-mail@v18
      with:
        server_address: smtp.gmail.com
        server_port: 465
        secure: true
        username: ${{ inputs.smtp_user }}
        password: ${{ inputs.smtp_pass }}
        # Deliberately not an input. See the note at the top of this file.
        from: The Ledger Bot <marketing@jparkassociates.com>
        to: ${{ inputs.to }}
        subject: ${{ inputs.subject }}
        body: ${{ inputs.body }}
        html_body: ${{ inputs.html_file != '' && format('file://{0}', inputs.html_file) || '' }}
        attachments: ${{ inputs.attachments }}
