<!DOCTYPE html>
<!-- ============================================================
     EMAIL SIGNATURE — dark-mode-safe
     Open this file in a browser, select all (Cmd/Ctrl+A), copy,
     and paste into Gmail Settings → Signature. See README.md.

     Why it is built this way:
       - Every colour here reads on a white background AND on a
         near-black one, because mail clients recolour text in dark
         mode but never recolour images.
       - The logo is an OPAQUE plate (its navy background is baked
         into the PNG), so the client's background can never show
         through the wordmark. This is the actual fix.
       - Absolute image URL only — the site is the image host.
       - All styles inline; Gmail strips <style> blocks and classes.

     Before using: replace {{DISCLAIMER}} with the firm's full
     confidentiality text.
     ============================================================ -->
<html lang="en">
<head><meta charset="UTF-8" /><title>J Park &amp; Associates — email signature</title></head>
<body style="margin:0;padding:0;">

<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;">

  <!-- Identity + contact -->
  <tr>
    <td style="padding:0 22px 0 0;vertical-align:top;">
      <div style="font:700 17px/1.35 Arial,Helvetica,sans-serif;color:#1B2A4A;">Jason Park</div>
      <div style="font:400 13px/1.5 Arial,Helvetica,sans-serif;color:#B08C33;letter-spacing:.3px;">J Park &amp; Associates</div>
    </td>
    <td style="padding:2px 0 2px 22px;vertical-align:top;border-left:3px solid #C9A84C;">
      <div style="font:400 13px/1.6 Arial,Helvetica,sans-serif;color:#3A4660;">2529 Foothill Blvd. Ste 101</div>
      <div style="font:400 13px/1.6 Arial,Helvetica,sans-serif;color:#3A4660;">La Crescenta, CA 91214</div>
      <div style="font:400 13px/1.6 Arial,Helvetica,sans-serif;color:#3A4660;padding-top:6px;">
        <span style="color:#8A93A6;">P</span> (818)&nbsp;321-4678
        &nbsp;&nbsp;<span style="color:#8A93A6;">E</span>
        <a href="mailto:jasonpark@jparkassociates.com" style="color:#B08C33;text-decoration:none;">jasonpark@jparkassociates.com</a>
      </div>
    </td>
  </tr>

  <!-- Disclaimer -->
  <tr>
    <td colspan="2" style="padding:14px 0 0;">
      <div style="font:400 11px/1.5 Arial,Helvetica,sans-serif;color:#6B7488;max-width:640px;">
        <span style="font-weight:700;color:#4A5468;">Confidentiality &amp; Disclaimer:</span>
        {{DISCLAIMER}}
      </div>
    </td>
  </tr>

  <!-- Logo — opaque plate, background baked in -->
  <tr>
    <td colspan="2" bgcolor="#111c33" style="padding:0;background-color:#111c33;line-height:0;font-size:0;">
      <img src="https://jparkassociates.com/assets/brand/logo-signature-navy-760.png"
           alt="J Park &amp; Associates — Certified Public Accountants"
           width="300" height="94"
           style="display:block;width:300px;height:auto;border:0;outline:none;text-decoration:none;color:#F5F0E8;" />
    </td>
  </tr>

</table>

</body>
</html>
